name: ci

on:
  push:
    branches: ["**", "!dependabot/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: cd frontend && uv run npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/torch/hub/checkpoints
          key: laion-head-${{ runner.os }}-${{ hashFiles('src/calico/features/laion.py') }}
      - run: make check
        env:
          CALICO_HOME: ${{ runner.temp }}/calico-home
          CALICO_MAX_SKIPPED: 6

  macos:
    name: macOS check
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: cd frontend && uv run npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/torch/hub/checkpoints
          key: laion-head-${{ runner.os }}-${{ hashFiles('src/calico/features/laion.py') }}
      - run: make check
        env:
          CALICO_HOME: ${{ runner.temp }}/calico-home
          CALICO_MAX_SKIPPED: 2
          CALICO_DEVICE: cpu
